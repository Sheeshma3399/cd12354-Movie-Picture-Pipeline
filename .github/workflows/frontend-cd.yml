name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run test -- --watchAll=false

  build:
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 -t frontend:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: starter/frontend/k8s
    steps:
      - uses: actions/checkout@v4
      - run: kustomize edit set image frontend=frontend:${{ github.sha }}
      - run: kustomize build
